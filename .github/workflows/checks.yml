name: Checks
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  GIT_AUTHOR_NAME: Test Agent
  GIT_AUTHOR_EMAIL: test@example.invalid
  GIT_COMMITTER_NAME: Test Agent
  GIT_COMMITTER_EMAIL: test@example.invalid
jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: agent
      - run: npm test
        working-directory: agent
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CY_AGENT_HOME: ${{ github.workspace }}/.cy-agent-ci
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: agent
      - run: npm run typecheck
        working-directory: agent
      # 기존 전체 테스트에는 POSIX 경로 가정이 있다. Windows의 독립 실행 가능한 계약부터 검사한다.
      - run: node --test src/plat.test.ts src/ship-guard.test.ts src/provider-input.test.ts src/strict-schema.test.ts src/ics.test.ts
        working-directory: agent
